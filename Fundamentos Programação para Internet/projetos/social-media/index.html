<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./app.css">

    <title>Igor Carmona - Social Tree</title>
</head>
<body>
    <div class="container">
        <div class="tree-container">
            <div class="avatar">
                <img src="./assets/avatar-mulher.svg" alt="User image profile">
            </div>

            <!-- Ao digitar span.algumacoisa, ele cria uma linha no projeto com uma classe. -->
            <span class="insta-user">@carmonadj_</span>

            <div class="links-container">
                <a href="" class="link" target="_blank">Link 1</a>
                <a href="" class="link"target="_blank">Link 2</a>
                <a href="" class="link"target="_blank">Link 3</a>
                <a href="" class="link"target="_blank">Link 4</a>
            </div>

            <div class="socials-container">
                <a href="" class="icon">
                    <img src="./assets/github.svg" alt="GitHub Image">
                </a>
                <a href="" class="icon">
                    <img src="./assets/instagram.svg" alt="Instagram Image">
                </a>
                <a href="" class="icon">
                    <img src="./assets/linkedin.svg" alt="LinkedIn Image">
                </a>
            </div>
        </div>
    </div>
</body>
</html>
