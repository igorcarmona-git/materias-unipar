<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button id="bt">Iniciar máquina</button>
    <p>A máquina está parada.</p>

    <script>
        var botao = document.querySelector('#bt');
        var texto = document.querySelector('p');

        botao.addEventListener('click', updateBotao);

        function updateBotao() {

        if (botao.textContent === 'Iniciar máquina') {
            botao.textContent = 'Parar máquina';
            texto.textContent = 'A máquina iniciou!';
            

        } else {
            botao.textContent = 'Iniciar máquina';
            texto.textContent = 'A máquina está parada.';
            
            }
        }


    </script>
    
</body>
</html>
