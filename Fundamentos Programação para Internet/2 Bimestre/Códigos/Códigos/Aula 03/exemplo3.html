<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 id="bemVindo"></h1>

    <script>
        
        var boasVindas = document.querySelector("#bemVindo")

        var meuNome = prompt('Por favor, digite seu nome.');
        var idade = prompt('Por favor, digite sua idade.');

        boasVindas.textContent = "Bem vindo " + meuNome + " idade: " + idade;
        
    </script>

</body>
</html>
