<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de DEVs</title>
    <link rel="stylesheet" href="formulario-style.css">
</head>
<body>
    <form action="" id="form1" method="post">
        <div>
            <h1 id="titulo">Formulário de cadastro de DEVs</h1>
            <p id="subtitulo">Complete com suas informações</p>
            <br>
        </div>

        <fieldset class="grupo">
            <div class="campo">
                <label for="name"><strong>Nome:</strong></label>
                <input type="text" name="name" id="name" required placeholder="Seu primeiro nome">
            </div>

            <div class="campo">
                <label for="sobrenome"><strong>Sobrenome:</strong></label>
                <input type="text" name="sobrenome" id="sobrenome" required placeholder="Seu sobrenome">
            </div>
        </fieldset>

        <div class="campo">
            <label for="email"><strong>E-mail:</strong></label>
            <input type="email" name="email" id="email" required placeholder="email@dominio.com">
        </div>

        <div class="campo">
            <label><strong>De qual lado da aplicação voce desenvolve?</strong></label>
            <label>
                <input type="radio" name="devweb" id="devweb" value="frontend" checked>Front-End
            </label>
            <label>
                <input type="radio" name="devweb" id="devweb" value="backend">Back-End
            </label>
            <label>
                <input type="radio" name="devweb" id="devweb" value="fullstack">Full-Stack
            </label>
        </div>

        <div class="campo">
            <label for="senioridade"><strong>Senioridade:</strong></label>
            <select name="senioridade" id="senioridade">
                <option value="" selected disabled>Escolha</option>
                <option value="junior">Junior</option>
                <option value="pleno">Pleno</option>
                <option value="senior">Senior</option>
            </select>
        </div>

        <fieldset class="grupo">
            <div id="cheack">
                <label>Selecione as tecnologias que utiliza:</label>
                <input type="checkbox" name="tecnologia1" id="tecnologia1" value="HTML">
                <label for="tecnologia1">HTML</label>
                <input type="checkbox" name="tecnologia2" id="tecnologia2" value="CSS">
                <label for="tecnologia2">CSS</label>
                <input type="checkbox" name="tecnologia3" id="tecnologia3" value="JavaScript">
                <label for="tecnologia3">Javascript</label>
                <input type="checkbox" name="tecnologia4" id="tecnologia4" value="Python">
                <label for="tecnologia4">Python</label>
                <label for="outros">Outros</label>
                <input type="text" name="outros" id="outros" placeholder="Escreva a tecnologia">
            </div>
        </fieldset>

        <div class="campo">
            <br>
            <label for="experiencia"><strong>Conte um pouco da sua experiência:</strong></label>
            <textarea rows="6" style="width: 26em" id="experiencia" name="experiencia"></textarea>
        </div>

        <button class="botao" type="submit">Concluido</button>
    </form>
</body>
</html>
